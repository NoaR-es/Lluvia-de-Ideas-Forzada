<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="50%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#9334E8"/>
    </linearGradient>
    <filter id="cardShadow1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#FFFFFF"/>
  <rect x="0" y="32" width="800" height="10" fill="#FFFFFF"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>

  <!-- Browser URL Omnibar -->
  <rect x="140" y="9" width="520" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <path d="M152 21 a4 4 0 0 1 8 0 v3 h-8 z M156 15 a2 2 0 0 1 2 2 v4 h-4 v-4 a2 2 0 0 1 2 -2" fill="#64748B"/>
  <text x="168" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155">https://aistudio.google.com</text>

  <!-- Google AI Studio Top Navigation -->
  <rect x="0" y="43" width="800" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="91" x2="800" y2="91" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Logo Gemini -->
  <g transform="translate(20, 55)">
    <path d="M12 0 C12 6.6 6.6 12 0 12 C6.6 12 12 17.4 12 24 C12 17.4 17.4 12 24 12 C17.4 12 12 6.6 12 0 Z" fill="url(#geminiGrad)"/>
    <text x="32" y="17" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#1E293B">Google AI Studio</text>
  </g>

  <!-- User profile right top -->
  <rect x="680" y="53" width="100" height="28" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="696" cy="67" r="9" fill="#2563EB"/>
  <text x="696" y="70" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle">G</text>
  <text x="712" y="71" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">Cuenta</text>

  <!-- Left Sidebar (Navigation real de Google AI Studio) -->
  <rect x="0" y="92" width="220" height="408" fill="#FFFFFF"/>
  <line x1="220" y1="92" x2="220" y2="500" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Sidebar Items -->
  <g transform="translate(14, 106)">
    <!-- Create prompt button -->
    <rect x="0" y="0" width="192" height="34" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="14" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3730A3">+ Create new prompt</text>

    <!-- Prompts group -->
    <text x="12" y="58" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94A3B8" letter-spacing="1">WORKSPACE</text>
    
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="192" height="28" rx="6" fill="transparent"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#475569">💬  Chat prompt</text>
    </g>

    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="192" height="28" rx="6" fill="transparent"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#475569">📝  Freeform prompt</text>
    </g>

    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="192" height="28" rx="6" fill="transparent"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#475569">📊  Structured prompt</text>
    </g>

    <!-- HIGHLIGHTED TARGET: GET API KEY -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="192" height="42" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="12" y="26" font-family="sans-serif" font-size="13" font-weight="800" fill="#78350F">🔑  Get API key</text>
      <circle cx="174" cy="21" r="5" fill="#D97706"/>
    </g>

    <g transform="translate(0, 226)">
      <rect x="0" y="0" width="192" height="28" rx="6" fill="transparent"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#64748B">⚙️  Settings &amp; Quotas</text>
    </g>
    <g transform="translate(0, 256)">
      <rect x="0" y="0" width="192" height="28" rx="6" fill="transparent"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#64748B">📚  Documentation</text>
    </g>
  </g>

  <!-- Central Work Area -->
  <g transform="translate(240, 108)">
    <rect x="0" y="0" width="536" height="368" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow1)"/>
    
    <!-- Hero Banner inside Studio -->
    <rect x="24" y="24" width="488" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="44" y="56" font-family="sans-serif" font-size="18" font-weight="800" fill="#0F172A">Bienvenido a Google AI Studio</text>
    <text x="44" y="78" font-family="sans-serif" font-size="12" fill="#475569">Entorno de desarrollo oficial para acceder a los modelos Gemini 2.0 y Flash.</text>
    <rect x="44" y="92" width="140" height="24" rx="6" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="54" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">✓ Nivel Gratuito Activo (0 €)</text>

    <!-- Explanatory pointer box -->
    <g transform="translate(24, 154)">
      <rect x="0" y="0" width="488" height="190" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400E">📍 PASO 1: Dirígete al menú lateral izquierdo</text>
      <text x="24" y="58" font-family="sans-serif" font-size="12" fill="#78350F" font-weight="500">
        1. Inicia sesión con tu cuenta de Gmail (la misma de tu Android).
      </text>
      <text x="24" y="82" font-family="sans-serif" font-size="12" fill="#78350F" font-weight="500">
        2. En el menú de navegación de la izquierda, haz clic en <tspan font-weight="bold" fill="#0F172A">"Get API key"</tspan> (icono de llave 🔑).
      </text>
      <text x="24" y="106" font-family="sans-serif" font-size="12" fill="#78350F" font-weight="500">
        3. No necesitas tarjeta bancaria ni contratar planes de pago.
      </text>

      <!-- Direct Action Badge -->
      <g transform="translate(24, 126)">
        <rect x="0" y="0" width="280" height="42" rx="8" fill="#1E293B"/>
        <text x="16" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Acceso Directo: aistudio.google.com</text>
      </g>
    </g>
  </g>

  <!-- Pointer Arrow indicating the Get API Key button -->
  <g transform="translate(196, 266)">
    <line x1="0" y1="16" x2="60" y2="16" stroke="#DC2626" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="5,16 16,10 16,22" fill="#DC2626"/>
    <circle cx="5" cy="16" r="14" fill="none" stroke="#DC2626" stroke-width="2"/>
  </g>
</svg>
