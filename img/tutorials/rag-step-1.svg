<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <filter id="shadowRag" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="598" height="378" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <g transform="translate(80, 50)" filter="url(#shadowRag)">
    <rect width="440" height="280" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="30" y="24" width="80" height="22" rx="11" fill="#ECFDF5"/>
    <text x="40" y="38" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">RAG LOCAL</text>
    
    <text x="30" y="76" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Optimización de PDFs y Notas</text>
    <text x="30" y="96" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cómo estructurar tus archivos para embeddings de alta precisión</text>

    <!-- File Formats Comparison -->
    <g transform="translate(30, 115)">
      <rect width="180" height="74" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="14" y="26" fill="#15803D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">✓ PDFs con Texto Digital</text>
      <text x="14" y="44" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Informes, TXT o notas donde el texto es seleccionable. Indexación instantánea.</text>
    </g>

    <g transform="translate(225, 115)">
      <rect width="185" height="74" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="14" y="26" fill="#92400E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚠️ PDFs Escaneados</text>
      <text x="14" y="44" fill="#B45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Si es una foto/imagen sin OCR, pásalo previamente por OCR para extraer el texto.</text>
    </g>

    <!-- Practical tip -->
    <g transform="translate(30, 205)">
      <rect width="380" height="48" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="14" y="22" fill="#3730A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">💡 Tamaño Recomendado: Capítulos de 2 a 30 páginas</text>
      <text x="14" y="38" fill="#4338CA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Fragmentar documentos largos acelera la similitud coseno sub-120ms.</text>
    </g>
  </g>
</svg>
