<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="modalShadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Browser Omnibar -->
  <rect x="0" y="0" width="800" height="42" fill="#FFFFFF"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="140" y="9" width="520" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="168" y="25" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">https://aistudio.google.com/app/apikey</text>

  <!-- Dim overlay -->
  <rect x="0" y="42" width="800" height="458" fill="#0F172A" fill-opacity="0.5"/>

  <!-- Modal Dialog: Your API Key is Ready -->
  <g transform="translate(120, 72)">
    <rect x="0" y="0" width="560" height="364" rx="18" fill="#FFFFFF" filter="url(#modalShadow4)" stroke="#CBD5E1"/>

    <!-- Success Header -->
    <g transform="translate(36, 28)">
      <circle cx="18" cy="18" r="18" fill="#DCFCE7"/>
      <path d="M11 18 L16 23 L25 13" stroke="#16A34A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="48" y="18" font-family="sans-serif" font-size="18" font-weight="800" fill="#0F172A">Your API key is ready</text>
      <text x="48" y="36" font-family="sans-serif" font-size="12" fill="#64748B">Tu clave de autenticación Auth Key ha sido generada correctamente</text>
    </g>
    <line x1="0" y1="84" x2="560" y2="84" stroke="#F1F5F9"/>

    <!-- Key Field Box -->
    <g transform="translate(36, 104)">
      <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569" letter-spacing="0.5">API KEY GENERADA</text>
      
      <!-- Key Input with Copy Button -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="488" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="16" y="28" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#0F172A">AIzaSyD6xT8k9vL2mP0q4W7r1s5t3u8V</text>
        
        <!-- Copy Button with Feedback Indicator -->
        <g transform="translate(396, 5)">
          <rect x="0" y="0" width="84" height="36" rx="6" fill="#1D4ED8"/>
          <text x="42" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">📋 Copy</text>
        </g>
      </g>

      <!-- Key Metadata Badges -->
      <g transform="translate(0, 86)">
        <rect x="0" y="0" width="160" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="8" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1E40AF">🔒 Auth Key (Gemini API)</text>

        <rect x="170" y="0" width="150" height="24" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
        <text x="178" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">⚡ 15 RPM • 0 € Free Tier</text>
      </g>

      <!-- Security Warning Box -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="488" height="60" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
        <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400E">⚠️ Custodia y Seguridad de tu Clave:</text>
        <text x="16" y="42" font-family="sans-serif" font-size="10" fill="#78350F">
          No compartas esta clave ni la subas a GitHub. Pégala únicamente en la app móvil.
        </text>
      </g>
    </g>

    <!-- Dialog Footer -->
    <line x1="0" y1="310" x2="560" y2="310" stroke="#F1F5F9"/>
    <g transform="translate(36, 322)">
      <text x="0" y="20" font-family="sans-serif" font-size="11" fill="#64748B">Haz clic en Copy y ve al siguiente paso para pegarla en tu móvil.</text>
      <g transform="translate(408, 0)">
        <rect x="0" y="0" width="80" height="32" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="40" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Close</text>
      </g>
    </g>
  </g>
</svg>
