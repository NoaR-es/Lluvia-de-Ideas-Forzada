<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad4)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#FFFFFF"/>
  <path d="M0 26 h600 v16 h-600 z" fill="#FFFFFF"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="140" y="9" width="320" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="210" y="25" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">aistudio.google.com/app/apikey</text>

  <!-- Success Modal: Key Generated -->
  <g transform="translate(90, 65)" filter="url(#shadow4)">
    <rect width="420" height="280" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Step Badge & Success Check -->
    <rect x="30" y="22" width="70" height="22" rx="11" fill="#EEF2FF"/>
    <text x="42" y="36" fill="#4F46E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PASO 4</text>
    
    <g transform="translate(360, 20)">
      <circle cx="16" cy="16" r="14" fill="#ECFDF5"/>
      <path d="M10 16 l4 4 l8 -8" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="30" y="72" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">¡Tu API Key ha sido creada!</text>
    <text x="30" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Copia la clave al portapapeles. Solo tú tienes acceso a ella.</text>

    <!-- Key Input Box with Copy Button -->
    <g transform="translate(30, 114)">
      <rect width="360" height="52" rx="10" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1.8"/>
      
      <!-- Key Icon -->
      <path d="M16 26 a4 4 0 1 1 8 0 a4 4 0 0 1 -8 0 m7 -1 h6 v3 h-2 v2 h-2 v-2 h-2" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      
      <!-- Masked Key text -->
      <text x="44" y="32" fill="#0F172A" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">AIzaSyDx93kL...8X4mQ21</text>
      
      <!-- Copy Button inside Input -->
      <g transform="translate(268, 8)">
        <rect width="84" height="36" rx="8" fill="#4F46E5"/>
        <!-- Copy Dual Rectangles Icon -->
        <path d="M14 14 h10 v12 h-10 z M18 10 h10 v12 h-4" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Copiar</text>
      </g>

      <!-- Click Indicator -->
      <circle cx="310" cy="26" r="14" fill="#4F46E5" fill-opacity="0.2"/>
      <circle cx="310" cy="26" r="7" fill="#4F46E5"/>
    </g>

    <!-- Security Warning Callout -->
    <g transform="translate(30, 182)">
      <rect width="360" height="42" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="12" y="19" fill="#92400E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🔒 Mantén tu clave privada y segura</text>
      <text x="12" y="33" fill="#B45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">No la compartas ni la envíes en chats públicos. Solo irá a tu app.</text>
    </g>

    <!-- Done Indicator -->
    <g transform="translate(30, 238)">
      <text x="0" y="18" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">✓ Clave lista para vincular</text>
      <text x="210" y="18" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Ahora abre la App en tu móvil ➔</text>
    </g>
  </g>
</svg>
