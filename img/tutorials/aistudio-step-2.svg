<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDim2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="modalShadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Background (dimmed) -->
  <rect width="800" height="500" rx="16" fill="#F1F5F9"/>
  <!-- Simulated background studio header and sidebar -->
  <rect x="0" y="0" width="800" height="42" fill="#FFFFFF"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="0" y="42" width="220" height="458" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="20" y="74" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">Google AI Studio</text>
  
  <!-- Dimmed Backdrop Overlay -->
  <rect width="800" height="500" rx="16" fill="url(#bgDim2)"/>

  <!-- Terms of Service Real Google Modal -->
  <g transform="translate(130, 48)">
    <rect x="0" y="0" width="540" height="404" rx="20" fill="#FFFFFF" filter="url(#modalShadow2)" stroke="#CBD5E1"/>
    
    <!-- Modal Header -->
    <g transform="translate(36, 32)">
      <circle cx="16" cy="16" r="16" fill="#EEF2FF"/>
      <path d="M12 8 L20 16 L12 24" stroke="#4F46E5" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="44" y="16" font-family="sans-serif" font-size="18" font-weight="800" fill="#0F172A">Términos del Servicio de Gemini API</text>
      <text x="44" y="34" font-family="sans-serif" font-size="12" fill="#64748B">Primer acceso a Google AI Studio</text>
    </g>

    <line x1="0" y1="90" x2="540" y2="90" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Terms Body -->
    <g transform="translate(36, 110)">
      <text x="0" y="16" font-family="sans-serif" font-size="12" fill="#334155" leading="1.6">
        Para comenzar a generar tus claves de API gratuitas, Google solicita aceptar las condiciones:
      </text>

      <!-- Checkbox 1 -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="#2563EB" stroke="#1D4ED8"/>
        <path d="M5 11 L9 15 L17 7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text x="32" y="15" font-family="sans-serif" font-size="12" font-weight="600" fill="#0F172A">Acepto los Términos de Servicio de las APIs de Google</text>
        <text x="32" y="30" font-family="sans-serif" font-size="11" fill="#64748B">y los Términos Adicionales de la API de Gemini.</text>
      </g>

      <!-- Checkbox 2 -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="#2563EB" stroke="#1D4ED8"/>
        <path d="M5 11 L9 15 L17 7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text x="32" y="15" font-family="sans-serif" font-size="12" font-weight="600" fill="#0F172A">Confirmo la Política de Uso Prohibido de IA Generativa</text>
        <text x="32" y="30" font-family="sans-serif" font-size="11" fill="#64748B">y el cumplimiento de la edad mínima regional requerida.</text>
      </g>

      <!-- Free of charge confirmation notice box -->
      <g transform="translate(0, 132)">
        <rect x="0" y="0" width="468" height="66" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
        <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">💡 Nivel de uso gratuito asegurado</text>
        <text x="16" y="44" font-family="sans-serif" font-size="11" fill="#15803D">
          La aceptación no requiere tarjeta de crédito ni facturación. Inicializa tu sandbox a coste 0 €.
        </text>
      </g>
    </g>

    <!-- Modal Footer -->
    <line x1="0" y1="334" x2="540" y2="334" stroke="#F1F5F9" stroke-width="1.5"/>
    <g transform="translate(36, 348)">
      <rect x="0" y="0" width="100" height="38" rx="8" fill="#F1F5F9"/>
      <text x="50" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Cancelar</text>

      <!-- Agree button with cursor -->
      <g transform="translate(308, 0)">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="#1D4ED8"/>
        <text x="80" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Aceptar y Continuar ➔</text>
      </g>
    </g>
  </g>
</svg>
