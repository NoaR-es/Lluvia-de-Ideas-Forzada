<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#FFFFFF"/>
  <path d="M0 26 h600 v16 h-600 z" fill="#FFFFFF"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="140" y="9" width="320" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="210" y="25" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">aistudio.google.com/terms</text>

  <!-- Modal Dialog: Terms of Service -->
  <g transform="translate(90, 60)" filter="url(#shadow2)">
    <rect width="420" height="295" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Header & Badge -->
    <rect x="30" y="20" width="70" height="22" rx="11" fill="#EEF2FF"/>
    <text x="42" y="34" fill="#4F46E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PASO 2</text>
    
    <text x="30" y="66" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Términos de Servicio de IA de Google</text>
    <text x="30" y="86" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Aparece únicamente la primera vez que entras en la plataforma</text>

    <!-- Checkbox 1: Terms of Service -->
    <g transform="translate(30, 106)">
      <rect width="20" height="20" rx="5" fill="#4F46E5"/>
      <path d="M5 10 l3 4 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="32" y="14" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Acepto los Términos del Servicio de Google APIs</text>
      <text x="32" y="28" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Incluye los términos adicionales de Gemini API y uso gratuito</text>
    </g>

    <!-- Checkbox 2: Age Verification -->
    <g transform="translate(30, 154)">
      <rect width="20" height="20" rx="5" fill="#4F46E5"/>
      <path d="M5 10 l3 4 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="32" y="14" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Confirmo que tengo al menos 18 años de edad</text>
      <text x="32" y="28" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Requisito estándar de cumplimiento normativo</text>
    </g>

    <!-- Callout: Zero Cost -->
    <g transform="translate(30, 196)">
      <rect width="360" height="34" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="14" y="21" fill="#15803D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💡 Importante: Aceptar estos términos no tiene ningún coste.</text>
    </g>

    <!-- Button 'Agree and Continue' -->
    <g transform="translate(30, 242)">
      <rect width="360" height="38" rx="10" fill="#4F46E5"/>
      <text x="130" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Aceptar y Continuar ➔</text>
      
      <!-- Click Indicator Pin -->
      <circle cx="280" cy="19" r="12" fill="#FFFFFF" fill-opacity="0.25"/>
      <circle cx="280" cy="19" r="6" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
