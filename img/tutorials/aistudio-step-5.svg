<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad5)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left: Explanatory Card -->
  <g transform="translate(40, 50)" filter="url(#shadow5)">
    <rect width="250" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="20" y="20" width="70" height="22" rx="11" fill="#EEF2FF"/>
    <text x="32" y="34" fill="#4F46E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PASO 5</text>

    <text x="20" y="68" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Pega tu Clave</text>
    <text x="20" y="88" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">en la Aplicación</text>
    
    <text x="20" y="118" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Abre 'Lluvia de Ideas Forzada' en tu Android:</text>

    <g transform="translate(20, 134)">
      <circle cx="8" cy="8" r="8" fill="#EEF2FF"/>
      <text x="5" y="12" fill="#4F46E5" font-size="10" font-weight="700">1</text>
      <text x="24" y="12" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Entra en Ajustes ⚙️</text>
    </g>

    <g transform="translate(20, 164)">
      <circle cx="8" cy="8" r="8" fill="#EEF2FF"/>
      <text x="5" y="12" fill="#4F46E5" font-size="10" font-weight="700">2</text>
      <text x="24" y="12" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Pulsa 'Clave de API'</text>
    </g>

    <g transform="translate(20, 194)">
      <circle cx="8" cy="8" r="8" fill="#EEF2FF"/>
      <text x="5" y="12" fill="#4F46E5" font-size="10" font-weight="700">3</text>
      <text x="24" y="12" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Pega y pulsa 'Guardar'</text>
    </g>

    <rect x="20" y="226" width="210" height="34" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="32" y="247" fill="#065F46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🎉 ¡Listo para crear ideas!</text>
  </g>

  <!-- Right: Android Phone Mockup (App Settings Screen) -->
  <g transform="translate(320, 24)" filter="url(#shadow5)">
    <!-- Phone Outer Body -->
    <rect width="230" height="330" rx="34" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    
    <!-- Phone Inner Screen -->
    <rect x="8" y="8" width="214" height="314" rx="26" fill="#F8FAFC"/>
    
    <!-- Phone Notch / Camera Pill -->
    <rect x="80" y="14" width="70" height="12" rx="6" fill="#0F172A"/>

    <!-- App Top Bar inside Phone -->
    <g transform="translate(16, 36)">
      <text x="0" y="16" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">⚙️ Ajustes de IA</text>
      <line x1="0" y1="24" x2="198" y2="24" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Provider Selector -->
    <g transform="translate(16, 72)">
      <text x="0" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">PROVEEDOR ACTIVO</text>
      <rect y="16" width="198" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="10" y="34" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Google Gemini (Cloud BYOK)</text>
      <circle cx="184" cy="30" r="4" fill="#10B981"/>
    </g>

    <!-- Key Input Field -->
    <g transform="translate(16, 126)">
      <text x="0" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">CLAVE DE API (AI STUDIO)</text>
      <rect y="16" width="198" height="32" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
      <text x="10" y="36" fill="#0F172A" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700">AIzaSyDx93kL...8X4m</text>
    </g>

    <!-- Save Button -->
    <g transform="translate(16, 184)">
      <rect width="198" height="34" rx="8" fill="#4F46E5"/>
      <text x="64" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Validar y Guardar</text>
    </g>

    <!-- Success Feedback Badge -->
    <g transform="translate(16, 230)">
      <rect width="198" height="48" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="9" fill="#10B981"/>
      <path d="M16 24 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="36" y="20" fill="#065F46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">Conexión Verificada</text>
      <text x="36" y="34" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Gemini Flash &amp; Pro Activo • Ilimitado</text>
    </g>
  </g>
</svg>
