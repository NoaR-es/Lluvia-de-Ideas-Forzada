<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="phoneShadow5" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left Side: Explanatory Card -->
  <g transform="translate(48, 60)">
    <rect x="0" y="0" width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <g transform="translate(28, 28)">
      <span font-family="sans-serif">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
        <text x="10" y="15" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338CA">PASO 5</text>
      </span>
      <text x="0" y="52" font-family="sans-serif" font-size="20" font-weight="800" fill="#0F172A">Pega tu Clave en la App</text>
      <text x="0" y="76" font-family="sans-serif" font-size="12" fill="#64748B">Conexión directa y encriptada en tu Android:</text>

      <!-- Steps list -->
      <g transform="translate(0, 100)">
        <circle cx="10" cy="10" r="10" fill="#EEF2FF"/>
        <text x="10" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4F46E5" text-anchor="middle">1</text>
        <text x="30" y="14" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Abre la app y entra en <tspan font-weight="bold" fill="#0F172A">Ajustes (⚙️)</tspan></text>
      </g>

      <g transform="translate(0, 140)">
        <circle cx="10" cy="10" r="10" fill="#EEF2FF"/>
        <text x="10" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4F46E5" text-anchor="middle">2</text>
        <text x="30" y="14" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Selecciona <tspan font-weight="bold" fill="#0F172A">Proveedor: Google Gemini</tspan></text>
      </g>

      <g transform="translate(0, 180)">
        <circle cx="10" cy="10" r="10" fill="#EEF2FF"/>
        <text x="10" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4F46E5" text-anchor="middle">3</text>
        <text x="30" y="14" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Pega tu clave en <tspan font-weight="bold" fill="#0F172A">Clave de API Gemini</tspan></text>
      </g>

      <g transform="translate(0, 220)">
        <circle cx="10" cy="10" r="10" fill="#DCFCE7"/>
        <text x="10" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16A34A" text-anchor="middle">4</text>
        <text x="30" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803D">Pulsa 'Validar y Guardar' ✓</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Real Phone Mockup with App Settings -->
  <g transform="translate(450, 25)" filter="url(#phoneShadow5)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="300" height="450" rx="36" fill="#1E293B" stroke="#334155" stroke-width="4"/>
    <!-- Screen Area -->
    <rect x="10" y="10" width="280" height="430" rx="28" fill="#FFFFFF"/>
    
    <!-- Phone Top Camera Notch -->
    <rect x="95" y="14" width="90" height="12" rx="6" fill="#0F172A"/>

    <!-- App Header -->
    <g transform="translate(24, 42)">
      <text x="0" y="14" font-family="sans-serif" font-size="14" font-weight="800" fill="#0F172A">⚙️  Ajustes de IA</text>
      <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#64748B">Lluvia de Ideas Forzada v2.4</text>
    </g>
    <line x1="10" y1="80" x2="290" y2="80" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- App Settings Content -->
    <g transform="translate(24, 94)">
      <!-- Provider Selector Card -->
      <rect x="0" y="0" width="252" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#64748B">PROVEEDOR ACTIVO</text>
      <text x="12" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E293B">Google Gemini (Cloud BYOK)</text>
      <circle cx="232" cy="26" r="5" fill="#10B981"/>

      <!-- API Key Input Field -->
      <g transform="translate(0, 68)">
        <text x="0" y="12" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569">CLAVE DE API (AI STUDIO)</text>
        <rect x="0" y="20" width="252" height="38" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
        <text x="10" y="44" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#0F172A">AIzaSyD6xT8k...9X2m</text>
      </g>

      <!-- Validate & Save Button -->
      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="252" height="40" rx="10" fill="#4F46E5"/>
        <text x="126" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Validar y Guardar</text>
      </g>

      <!-- Success Verified Badge in App -->
      <g transform="translate(0, 198)">
        <rect x="0" y="0" width="252" height="74" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
        <circle cx="22" cy="24" r="10" fill="#DCFCE7"/>
        <path d="M17 24 L21 28 L27 19" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="38" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803D">Conexión Verificada</text>
        <text x="38" y="36" font-family="sans-serif" font-size="9" fill="#166534">Modelos Gemini 2.0 Flash y Pro activos</text>
        <text x="12" y="60" font-family="sans-serif" font-size="9" font-weight="600" fill="#047857">✓ Clave encriptada en Android Keystore local</text>
      </g>
    </g>
  </g>
</svg>
